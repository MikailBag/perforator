on:
  push:
    tags:
      - v*
permissions:
  contents: write
  attestations: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tespkg/actions-cache/restore@91b54a6e03abb8fcec12d3743633d23a1cfcd269
        with:
          endpoint: storage.yandexcloud.net
          accessKey: ${{ secrets.CACHE_ACCESS_KEY }}
          secretKey: ${{ secrets.CACHE_SECRET_KEY }}
          bucket: ${{ secrets.CACHE_BUCKET }}
          # Don't bother trying github cache, we don't fit in its 10GB limit
          use-fallback: false
          key: v1-${{ github.sha }}
          restore-keys: |
            v1-
          path: ~/.ya/build
      - name: Build binaries (amd64)
        run: |
          ./ya make --target-platform default-linux-x86_64 -r --musl --gc ./perforator/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-amd64
          path: ./perforator/bundle
      - name: Build binaries (arm64)
        run: |
          ./ya make --target-platform default-linux-aarch64 -r --musl --gc ./perforator/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-arm64
          path: ./perforator/bundle
  build-autofdo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@v4
        with:
          path: ./autofdo/build
          key: v1-${{ github.sha }}
          restore-keys: |
            v1-
      - name: Build AutoFDO
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev libgflags-dev libssl-dev libelf-dev protobuf-compiler \
              cmake libzstd-dev clang g++ git build-essential
          git clone --recursive --revision 8f9ab68921f364a6433086245ca3f19befacfeb1 --depth 1 https://github.com/google/autofdo.git
          cd autofdo
          git submodule update --init --recursive
          mkdir build
          cd build
          cmake -DENABLE_TOOL=LLVM -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release ../
          make -j $(nproc) create_llvm_prof
      - uses: actions/upload-artifact@v4
        with:
          name: autofdo
          path: ./autofdo/build/create_llvm_prof  
  release-cli:
    runs-on: ubuntu-24.04
    needs:
      - build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: binaries-amd64
          path: amd64
      - uses: actions/download-artifact@v5
        with:
          name: binaries-arm64
          path: arm64
      - name: Attach binaries to release
        run: |
          mv ./amd64/cli ./cli-amd64 && chmod +x ./cli-amd64
          mv ./arm64/cli ./cli-arm64 && cmmod +x ./cli-arm64
          mv ./amd64/migrate ./migrate-amd64 && chmod +x ./migrate-amd64
          mv ./arm64/migrate ./migrate-arm64 && chmod +x ./migrate-arm64
          cp ./cli-amd64 ./cli
          cp ./migrate-amd64 ./migrate
          gh -R ${{ github.repository }} release create --target ${{ github.sha }} --verify-tag --latest=false --draft ${{ github.ref_name }} \
            ./cli-amd64 ./migrate-amd64 ./cli-arm64 ./migrate-arm64 ./cli ./migrate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-images:
    runs-on: ubuntu-24.04
    needs:
      - build
      - build-autofdo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: binaries-amd64
          path: dist/linux-amd64
      - uses: actions/download-artifact@v5
        with:
          name: binaries-arm64
          path: dist/linux-arm64
      - uses: actions/download-artifact@v5
        with:
          name: autofdo
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
      - name: Initialize Yandex Cloud CLI
        env:
          KEY: ${{ secrets.CONTAINER_REGISTRY_KEY }}
        run: |
          ~/yandex-cloud/bin/yc config profile create default
          echo "${KEY}" > ./key.json
          ~/yandex-cloud/bin/yc config set service-account-key ./key.json
          cat key.json | jq ".service_account_id"
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Log in to Yandex Container Registry
        run: |
          ~/yandex-cloud/bin/yc container registry configure-docker
      - name: Build and push images
        run: |
          export PATH=~/yandex-cloud/bin:${PATH}
          mv ./create_llvm_prof ./dist/
          chmod +x ./dist/create_llvm_prof
          function build {
              chmod +x ./dist/$1
              export ORG=mikailbag
              export EXTRA_CR=${{ secrets.CONTAINER_REGISTRY }}
              export VERSION=${{ github.ref_name }}
              export PLATFORM=linux/amd64,linux/arm64

              bash perforator/ci/scripts/build.image.sh
          }
          build agent
          build gc
          build migrate
          build offline_processing
          build proxy
          build storage
          build web
